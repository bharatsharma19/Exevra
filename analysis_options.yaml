# Static analysis configuration for Exevra.
#
# Run with `flutter analyze`. The tree is expected to report zero issues.
# Prefer fixing a finding over suppressing it; any `// ignore:` comment must
# carry a short justification next to it.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/**/*.g.dart
    - lib/l10n/generated/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_await_in_return
    - use_build_context_synchronously
