#:schema https://supabase.com/schemas/config/v1.json
# Local development configuration for the Supabase CLI (v3).
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file only governs the LOCAL stack started with `supabase start`. The hosted project's auth
# settings (site URL, redirect allow-list, SMTP, providers, rate limits, captcha, password policy)
# are configured in the Supabase dashboard and must be kept in step with the values below.
project_id = "exevra"

[api]
enabled = true
port = 54321
# Schemas exposed through the Data API.
schemas = ["public", "graphql_public"]
# Extra schemas added to the search_path of every API request.
extra_search_path = ["public", "extensions"]
# Maximum rows returned by a single API request.
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
# Port used by `supabase db diff` to start the shadow database.
shadow_port = 54320
health_timeout = "2m"
# Must match the hosted database (`SHOW server_version;`).
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
# Migrations in supabase/migrations/ are the single source of truth for the schema.
enabled = true
schema_paths = []

[db.seed]
# Seed data for local development only (never applied to the hosted project).
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher: every email sent by the local stack (sign-up confirmation, password recovery,
# email change) is captured here and can be read in the web interface. Nothing leaves the machine.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
# The app's deep-link callback. Used as the default redirect target and in email links.
site_url = "com.exevra.app://auth-callback"
# Exact URLs that auth flows may redirect to.
additional_redirect_urls = [
  "com.exevra.app://auth-callback",
  "https://exevra.app/auth/callback",
  "http://127.0.0.1:3000",
]
# Access token lifetime in seconds.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# Emails sent per hour (applies when a custom SMTP server is configured).
email_sent = 30
# SMS is not used by the app.
sms_sent = 0
anonymous_users = 30
# Session refreshes per 5 minutes per IP.
token_refresh = 150
# Sign-up and sign-in requests per 5 minutes per IP.
sign_in_sign_ups = 30
# OTP / link verifications per 5 minutes per IP.
token_verifications = 30
web3 = 30

[auth.email]
enabled = true
# Confirm an email change on both the old and the new address.
double_confirm_changes = true
# Users must confirm their email address before they can sign in.
enable_confirmations = true
# Require a recent sign-in to change the password.
secure_password_change = true
# Minimum interval between two confirmation / recovery emails to the same address.
max_frequency = "60s"
# Length and lifetime of the 6-digit email codes.
otp_length = 6
otp_expiry = 3600

# Production SMTP is NOT configured here. Set the transactional SMTP provider for auth emails in the
# hosted project's dashboard (Authentication > Emails > SMTP settings). Locally, mail goes to the
# [local_smtp] catcher above.

[auth.email.template.confirmation]
subject = "Confirm your Exevra account"
content_path = "./supabase/email_templates/confirm_signup.html"

[auth.email.template.recovery]
subject = "Your Exevra password reset code"
content_path = "./supabase/email_templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Exevra"
content_path = "./supabase/email_templates/email_change.html"

[auth.sms]
# Phone sign-in is not offered by the app.
enabled = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Google sign-in. Disabled locally. To test it locally, create OAuth client IDs in Google Cloud,
# export the values below in your shell (never commit them) and set enabled = true:
#   client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"   # the WEB client ID (serverClientId)
#   secret    = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# The hosted project configures Google under Authentication > Providers, including the Android
# client ID in "Authorized Client IDs".
[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Sign in with Apple (iOS only). Disabled locally. To enable, export the values below and set
# enabled = true:
#   client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"    # com.exevra.app
#   secret    = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true
# `per_worker` enables hot reload during local development.
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"
